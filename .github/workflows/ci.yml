name: ci
on: { push: { branches: [main] }, pull_request: { branches: [main] } }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.100' }
      - run: dotnet restore NotifService.sln
      - run: dotnet build NotifService.sln --configuration Release --warnaserror --no-restore
      - run: dotnet test NotifService.sln --no-build
      - run: dotnet format NotifService.sln --verify-no-changes --no-restore
